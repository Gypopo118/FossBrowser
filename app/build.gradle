apply plugin: 'com.android.application'

def ciKeystore = System.getenv('FOSSBROWSER_KEYSTORE')

android {

    compileSdk = 37
    namespace 'de.baumann.browser'

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (ciKeystore != null) {
            ci {
                storeFile file(ciKeystore)
                storeType 'PKCS12'
                storePassword System.getenv('FOSSBROWSER_STORE_PASSWORD')
                keyAlias System.getenv('FOSSBROWSER_KEY_ALIAS')
                keyPassword System.getenv('FOSSBROWSER_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId "de.baumann.browser"
        minSdk 29
        targetSdk 37

        versionCode 159
        versionName "24"
    }

    buildTypes {
        debug {
            if (ciKeystore != null) {
                signingConfig signingConfigs.ci
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ciKeystore != null) {
                signingConfig signingConfigs.ci
            }
        }
    }

    lint {
        checkReleaseBuilds false
        disable 'MissingTranslation'
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
}